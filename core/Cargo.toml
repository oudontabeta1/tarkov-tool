[package]
name = "tarkov-core"
version = "0.1.0"
edition = "2021"
description = "Wikitext parsers, SQLite storage and Fandom sync for the Tarkov helper app"

[dependencies]
anyhow = "1"
once_cell = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["time"] }
